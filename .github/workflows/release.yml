name: Release

# Empacota a extensão e anexa o .vsix a um GitHub Release toda vez que uma tag
# "v*" é empurrada (ex.: v0.2.0). Não publica no Marketplace -- só gera o
# arquivo que qualquer um baixa e instala com `code --install-extension`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm run package

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
